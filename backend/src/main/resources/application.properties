spring.application.name=control-financiero

# MySQL (desarrollo)
spring.datasource.url=jdbc:mysql://localhost:3306/cfp_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Zona horaria del equipo: Colombia (UTC-5)
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.jackson.time-zone=America/Bogota

# Seguridad: HTTP Basic
server.error.include-message=always
